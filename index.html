<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApniShop - Online Shopping</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5fa;
  color: #222;
}

header {
  background: #6c35d8;
  color: white;
  padding: 18px 12px;
  text-align: center;
}

header h1 {
  margin: 0 0 12px;
}

.search {
  width: 95%;
  max-width: 600px;
  padding: 13px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

.hero {
  margin: 15px;
  padding: 25px 15px;
  background: linear-gradient(135deg, #6c35d8, #a879ff);
  color: white;
  border-radius: 15px;
  text-align: center;
}

.hero h2 {
  margin-top: 0;
}

.categories {
  display: flex;
  gap: 8px;
  padding: 10px;
  overflow-x: auto;
}

.categories button {
  flex-shrink: 0;
  padding: 10px 15px;
  border: none;
  border-radius: 20px;
  background: white;
  cursor: pointer;
}

.categories button.active {
  background: #6c35d8;
  color: white;
}

h2.section-title {
  margin: 18px 12px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px #00000010;
  padding-bottom: 12px;
}

.product-image {
  width: 100%;
  height: 135px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #eee7ff;
  font-size: 65px;
}

.card h3 {
  font-size: 15px;
  margin: 10px;
}

.price {
  margin: 8px 10px;
  font-size: 18px;
  font-weight: bold;
  color: #6c35d8;
}

.card button {
  display: block;
  width: calc(100% - 20px);
  margin: 10px;
  padding: 10px 5px;
  background: #6c35d8;
  color: white;
  border: none;
  border-radius: 7px;
  cursor: pointer;
}

.cart {
  margin: 15px;
  padding: 16px;
  background: white;
  border-radius: 12px;
}

.cart-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.cart-item button {
  padding: 5px 9px;
  border: none;
  border-radius: 5px;
  background: #eee7ff;
}

.checkout {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  background: #159447;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

footer {
  background: #24163f;
  color: white;
  padding: 22px 12px;
  text-align: center;
  margin-top: 20px;
}

.empty {
  padding: 20px;
  text-align: center;
  grid-column: 1 / -1;
}

@media (min-width: 700px) {
  .products {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .product-image {
    height: 180px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛍️ ApniShop</h1>
  <div>आपकी अपनी ऑनलाइन शॉप</div>
  <br>
  <input
    class="search"
    id="search"
    type="search"
    placeholder="🔍 प्रोडक्ट खोजें..."
  >
</header>

<section class="hero">
  <h2>ApniShop में आपका स्वागत है! 🎉</h2>
  <p>अपनी पसंद का सामान चुनें और शॉपिंग करें।</p>
  <b>हर दिन नई पसंद, आपकी अपनी दुकान!</b>
</section>

<div class="categories" id="categories"></div>

<h2 class="section-title">🛒 हमारे प्रोडक्ट</h2>

<div class="products" id="products"></div>

<section class="cart" id="cart">
  <h2>🛒 आपका कार्ट</h2>
  <div id="cartItems">अभी कार्ट खाली है।</div>
  <h3 id="total">कुल: ₹0</h3>
  <button class="checkout" onclick="checkout()">
    WhatsApp से ऑर्डर करें
  </button>
</section>

<footer>
  <h3>ApniShop ❤️</h3>
  <p>आपकी अपनी ऑनलाइन शॉपिंग वेबसाइट</p>
  <p>सभी कीमतें डेमो के लिए हैं।</p>
</footer>

<script>
const products = [
  {id:1, name:"Men's T-Shirt", price:299, category:"कपड़े", icon:"👕"},
  {id:2, name:"Women's Dress", price:499, category:"कपड़े", icon:"👗"},
  {id:3, name:"Jeans", price:599, category:"कपड़े", icon:"👖"},
  {id:4, name:"Sports Shoes", price:799, category:"जूते", icon:"👟"},
  {id:5, name:"Slippers", price:199, category:"जूते", icon:"🩴"},
  {id:6, name:"Handbag", price:399, category:"बैग", icon:"👜"},
  {id:7, name:"School Bag", price:599, category:"बैग", icon:"🎒"},
  {id:8, name:"Watch", price:499, category:"एक्सेसरीज़", icon:"⌚"},
  {id:9, name:"Sunglasses", price:199, category:"एक्सेसरीज़", icon:"🕶️"},
  {id:10, name:"Earphones", price:299, category:"इलेक्ट्रॉनिक्स", icon:"🎧"},
  {id:11, name:"Beauty Kit", price:349, category:"ब्यूटी", icon:"💄"},
  {id:12, name:"Teddy Bear", price:299, category:"खिलौने", icon:"🧸"}
];

let selectedCategory = "सभी";
let cart = {};

const categories = [
  "सभी",
  ...new Set(products.map(p => p.category))
];

function renderCategories() {
  document.getElementById("categories").innerHTML =
    categories.map(category => `
      <button
        class="${category === selectedCategory ? "active" : ""}"
        onclick="selectCategory('${category}')">
        ${category}
      </button>
    `).join("");
}

function selectCategory(category) {
  selectedCategory = category;
  renderCategories();
  renderProducts();
}

function renderProducts() {
  const search = document.getElementById("search")
    .value.trim().toLowerCase();

  const filtered = products.filter(p =>
    (selectedCategory === "सभी" ||
      p.category === selectedCategory) &&
    p.name.toLowerCase().includes(search)
  );

  document.getElementById("products").innerHTML =
    filtered.length
      ? filtered.map(p => `
          <div class="card">
            <div class="product-image">${p.icon}</div>
            <h3>${p.name}</h3>
            <div class="price">₹${p.price}</div>
            <button onclick="addToCart(${p.id})">
              🛒 कार्ट में डालें
            </button>
          </div>
        `).join("")
      : '<div class="empty">कोई प्रोडक्ट नहीं मिला।</div>';
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function changeQuantity(id, amount) {
  cart[id] += amount;

  if (cart[id] <= 0) {
    delete cart[id];
  }

  renderCart();
}

function renderCart() {
  const items = Object.entries(cart);

  document.getElementById("cartItems").innerHTML =
    items.length
      ? items.map(([id, qty]) => {
          const p = products.find(p => p.id === Number(id));

          return `
            <div class="cart-item">
              <span>${p.icon} ${p.name}</span>
              <span>
                <button onclick="changeQuantity(${p.id}, -1)">−</button>
                ${qty}
                <button onclick="changeQuantity(${p.id}, 1)">+</button>
              </span>
              <b>₹${p.price * qty}</b>
            </div>
          `;
        }).join("")
      : "अभी कार्ट खाली है।";

  const total = items.reduce((sum, [id, qty]) => {
    const p = products.find(p => p.id === Number(id));
    return sum + p.price * qty;
  }, 0);

  document.getElementById("total").textContent = "कुल: ₹" + total;
}

function checkout() {
  const items = Object.entries(cart);

  if (!items.length) {
    alert("पहले कार्ट में प्रोडक्ट डालें!");
    return;
  }

  const phone = prompt(
    "दुकानदार का WhatsApp नंबर डालें, देश के कोड सहित।\nउदाहरण: 919876543210"
  );

  if (!phone) return;

  if (!/^\d{10,15}$/.test(phone)) {
    alert("कृपया सही WhatsApp नंबर डालें।");
    return;
  }

  let message = "Namaste! Mujhe ApniShop se order karna hai:\n\n";

  let total = 0;

  items.forEach(([id, qty]) => {
    const p = products.find(p => p.id === Number(id));
    message += `${p.name} x ${qty} = ₹${p.price * qty}\n`;
    total += p.price * qty;
  });

  message += `\nTotal: ₹${total}\n`;
  message += "Please confirm product availability and delivery charges.";

  window.open(
    "https://wa.me/" + phone + "?text=" + encodeURIComponent(message),
    "_blank"
  );
}

document.getElementById("search")
  .addEventListener("input", renderProducts);

renderCategories();
renderProducts();
renderCart();
</script>

</body>
</html>
